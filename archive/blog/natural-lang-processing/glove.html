    Notice something remarkable here: coffee and tea never appear in the same sentence together (their intersection in the matrix is 0).
</p>

<p class="brutalist-text-body mt-2">
    However, look at their neighboring rows:
</p>
<ul class="list-disc pl-6 space-y-1 brutalist-text-body my-2">
    <li><strong>coffee</strong> appears next to <em>like</em> (1 time) and <em>tastes</em> (1 time).</li>
    <li><strong>tea</strong> appears next to <em>like</em> (1 time) and <em>tastes</em> (1 time).</li>
</ul>

<p class="brutalist-text-body">
    Because coffee and tea share identical co-occurrence profiles across the corpus, GloVe deduces that they share a very similar semantic meaning. This concept—known as the <strong>Distributional Hypothesis</strong>—is the core engine behind GloVe.
</p>

<!-- Step 2 -->
<h3 class="text-lg font-bold text-black mt-6 mb-2">Step 2: Represent Words as Vectors & Use the Dot Product</h3>

<p class="brutalist-text-body">
    Next, GloVe assigns every word $i$ in the vocabulary a dense vector of real numbers, $w_i \\in \\mathbb{R}^d$ (typically 50 to 300 dimensions).
</p>

<p class="brutalist-text-body">
    To measure how compatible or similar two word vectors are, GloVe calculates their dot product:
    $$\\text{Similarity}(w_i, w_j) = w_i^T w_j$$
</p>

<h4 class="text-base font-bold text-black mt-4 mb-2">Quick Dot Product Intuition</h4>

<p class="brutalist-text-body">
    Suppose our model learns a 2D vector for coffee and tea:
    $$w_{\\text{coffee}} = \\begin{bmatrix} 0.8 \\\\ 0.3 \\end{bmatrix}, \\quad w_{\\text{tea}} = \\begin{bmatrix} 0.7 \\\\ 0.4 \\end{bmatrix}$$
</p>

<p class="brutalist-text-body">
    Their dot product is:
    $$w_{\\text{coffee}}^T w_{\\text{tea}} = (0.8 \\times 0.7) + (0.3 \\times 0.4) = 0.56 + 0.12 = 0.68$$
</p>

<p class="brutalist-text-body mt-2">Key interpretations:</p>
<ul class="list-disc pl-6 space-y-1 brutalist-text-body my-2">
    <li><strong>Large positive dot product:</strong> The vectors point in a similar direction (high compatibility and similarity).</li>
    <li><strong>Dot product near zero:</strong> The words are completely unrelated or orthogonal in concept space.</li>
</ul>

<!-- Step 3 -->
<h3 class="text-lg font-bold text-black mt-6 mb-2">Step 3: Match Vectors to Log Co-Occurrence Counts</h3>

<p class="brutalist-text-body">
    Now comes GloVe's main learning objective: Make the dot product of two word vectors reflect how often those words co-occur in real text.
</p>

<ul class="list-disc pl-6 space-y-1 brutalist-text-body my-2">
    <li>If word $i$ and word $j$ appear together frequently in the matrix ($X_{ij}$ is large), their vector dot product $w_i^T w_j$ should also be large.</li>
    <li>Instead of matching raw counts directly (which can range from $1$ to $1,000,000+$), GloVe fits the dot product to the logarithm of the co-occurrence count:</li>
</ul>

<p class="brutalist-text-body my-2">
    $$w_i^T \\tilde{w}_j \\approx \\log(X_{ij})$$
</p>

<p class="brutalist-text-body">
    To make the system symmetric and account for word frequency baseline offsets, GloVe adds a target bias $b_i$ and context bias $\\tilde{b}_j$:
    $$w_i^T \\tilde{w}_j + b_i + \\tilde{b}_j = \\log(X_{ij})$$
</p>

<!-- Step 4 -->
<h3 class="text-lg font-bold text-black mt-6 mb-2">Step 4: Fix Real-World Edge Cases with a Weighting Function</h3>

<p class="brutalist-text-body">
    In practice, fitting $\\log(X_{ij})$ runs into two major problems:
</p>

<ul class="list-disc pl-6 space-y-1 brutalist-text-body my-2">
    <li><strong>Zero Co-occurrences:</strong> Many word pairs never appear together ($X_{ij} = 0$), but $\\log(0)$ is mathematically undefined ($-\\infty$).</li>
    <li><strong>Stop Word Domination:</strong> Ultra-common words like "the", "is", and "and" co-occur constantly with almost everything and would drown out meaningful word relationships.</li>
</ul>

<p class="brutalist-text-body">
    GloVe solves both problems by wrapping the objective in a weighted least squares loss function using a capped weighting function $f(X_{ij})$:
    $$f(x) = \\begin{cases} \\left(\\frac{x}{x_{\\max}}\\right)^\\alpha & \\text{if } x < x_{\\max} \\\\ 1 & \\text{otherwise} \\end{cases}$$
    (Standard values: $x_{\\max} = 100$, $\\alpha = 0.75$)
</p>
<!-- Step 5 -->
<h3 class="text-lg font-bold text-black mt-6 mb-2">Step 5: Combine Dual Vectors for the Final Output</h3>

<p class="brutalist-text-body">
    During training, GloVe actually learns two separate vectors for every word:
</p>

<ul class="list-disc pl-6 space-y-1 brutalist-text-body my-2">
    <li><strong>Target vector ($w_i$):</strong> Used when the word acts as the central target word.</li>
    <li><strong>Context vector ($\\tilde{w}_i$):</strong> Used when the word appears in another word's context window.</li>
</ul>

<p class="brutalist-text-body">
    Because the co-occurrence matrix is symmetric, $w$ and $\\tilde{w}$ learn nearly identical representations—differing only due to random weight initialization.
</p>

<p class="brutalist-text-body">
    Once training completes, GloVe simply adds the two vectors together:
    $$w_{\\text{final}} = w_i + \\tilde{w}_i$$
</p>

<p class="brutalist-text-body mt-2">
    This simple addition achieves key practical benefits:
</p>
<ul class="list-disc pl-6 space-y-1 brutalist-text-body my-2">
    <li>Reduces vector noise</li>
    <li>Stabilizes mathematical representations</li>
    <li>Yields final high-quality embeddings ready for downstream NLP tasks</li>
</ul>`,
`<h2><strong>Mathematical Derivation of the GloVe Objective</strong></h2>

    <p class="brutalist-text-body">
        To force our word vectors to mirror these probability ratios, the researchers stepped through four logical stages:
    </p>

    <div class="space-y-4 my-4">
        <div>
            <h3><strong>Step 1: Start with the Ratio Goal</strong></h3>
            <p class="brutalist-text-body">
                We want some function $F$ that takes the vectors for target words $w_i, w_j$ and context word $\\tilde{w}_k$ to yield the probability ratio:
                $$F(w_i, w_j, \\tilde{w}_k) = \\frac{P_{ik}}{P_{jk}}$$
            </p>
        </div>

        <div>
            <h3><strong>Step 2: Use Vector Differences</strong></h3>
            <p class="brutalist-text-body">
                To encode linear directions (so $w_i - w_j$ represents a concept like "temperature difference"), we feed the difference between word vectors into the dot product with the probe word:
                $$F\\left((w_i - w_j)^T \\tilde{w}_k\\right) = \\frac{P_{ik}}{P_{jk}}$$
            </p>
        </div>

        <div>
            <h3 ><strong>Step 3: Turn Division into Subtraction</strong></h3>
            <p class="brutalist-text-body">
                To solve this cleanly, $F$ needs to turn vector addition into scalar multiplication—a property unique to the exponential function ($\\exp(x)$).
                Taking the log on both sides simplifies the relationship into straight subtraction:
                $$w_i^T \\tilde{w}_k = \\log(P_{ik}) = \\log(X_{ik}) - \\log(X_i)$$
                (where $X_{ik}$ is the co-occurrence count between word $i$ and $k$, and $X_i$ is the total count for word $i$.)
            </p>
        </div>

        <div>
            <h3 ><strong>Step 4: Add Bias Terms for Symmetry</strong></h3>
            <p class="brutalist-text-body">
                Because $\\log(X_i)$ depends only on word $i$, we absorb it into a trainable bias term $b_i$. We also add a context bias $\\tilde{b}_k$ so target and context words remain completely symmetric:
                $$w_i^T \\tilde{w}_k + b_i + \\tilde{b}_k = \\log(X_{ik})$$
            </p>
        </div>
    </div>

    <p class="brutalist-text-body">
        This elegant formula means: <strong>The dot product of two word vectors plus their biases should equal the log of their co-occurrence count.</strong>
    </p>

    <!-- Section 4 -->
    <h2><strong>4. The Loss Function & "The Secret Sauce"</strong></h2>

    <p class="brutalist-text-body">
        To train these vectors, GloVe uses a weighted least squares loss function:
        $$J = \\sum_{i,j=1}^V f(X_{ij}) \\left( w_i^T \\tilde{w}_j + b_i + \\tilde{b}_j - \\log X_{ij} \\right)^2$$
    </p>

    <p class="brutalist-text-body">
        Why do we need the weighting function $f(X_{ij})$?
    </p>

    <p class="brutalist-text-body">
        Raw counts $X_{ij}$ cause two practical problems:
    </p>

    <ul class="space-y-1 brutalist-text-body">
        <li>1. Words that never co-occur have $X_{ij} = 0$, and $\\log(0)$ is undefined.</li>
        <li>2. Ultra-frequent stop words like "the" or "is" co-occur so often they would completely steamroll all other word pairs.</li>
    </ul>

    <p class="brutalist-text-body">
        GloVe solves this with a clever weighting curve $f(x)$:
        $$f(x) = \\begin{cases} \\left(\\frac{x}{x_{\\max}}\\right)^\\alpha & \\text{if } x < x_{\\max} \\\\ 1 & \\text{otherwise} \\end{cases}$$
    </p>

    <p class="brutalist-text-body">
        How this weighting trick works:
    </p>

    <ul class="space-y-2 brutalist-text-body">
        <li>• If $X_{ij} = 0$, $f(0) = 0$, so zero-count pairs are simply ignored without breaking the log math.</li>
        <li>• Rare words get small weights so noise doesn't corrupt the embeddings.</li>
        <li>• Frequent words hit a hard ceiling at $x_{\\max} = 100$ (with power $\\alpha = 0.75$), preventing them from dominating training.</li>
    </ul>`,

            if (theme === 'dark') {
                root.classList.remove('theme-light');
                root.classList.add('theme-dark');
                if (themeText) themeText.textContent = 'DARK';
                if (sunIcon && moonIcon) {
                    sunIcon.classList.remove('hidden');
                    sunIcon.classList.add('block');
                    moonIcon.classList.remove('block');
                    moonIcon.classList.add('hidden');
                }
                localStorage.setItem('research-theme', 'dark');
            } else {
                root.classList.remove('theme-dark');
                root.classList.add('theme-light');
                if (themeText) themeText.textContent = 'LIGHT';
                if (sunIcon && moonIcon) {
                    sunIcon.classList.remove('block');
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                    moonIcon.classList.add('block');
                }
                localStorage.setItem('research-theme', 'light');
            }
        }

        const cachedTheme = localStorage.getItem('research-theme');
        setTheme(cachedTheme || 'light');

                const isDarkActive = root.classList.contains('theme-dark');
                setTheme(isDarkActive ? 'light' : 'dark');

            let mouseX = 0, mouseY = 0, currentX = 0, currentY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            }, { passive: true });

            function renderCursor() {
                currentX += (mouseX - currentX) * 0.18;
                currentY += (mouseY - currentY) * 0.18;
                root.style.setProperty('--cursor-x', `${currentX}px`);
                root.style.setProperty('--cursor-y', `${currentY}px`);
                requestAnimationFrame(renderCursor);
            }
            requestAnimationFrame(renderCursor);
        }

        // Sidebar Intersection Observer function
        function initScrollObserver() {
            const editorialSections = document.querySelectorAll('.editorial-section');
            const sidebarLinks = document.querySelectorAll('.editorial-nav-item');

            if (editorialSections.length > 0 && sidebarLinks.length > 0) {
                const sectionObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const activeID = entry.target.getAttribute('id');
                            sidebarLinks.forEach(link => link.classList.remove('active'));
                            const targetingLink = document.querySelector(`.editorial-nav-item[href="#${activeID}"]`);
                            if (targetingLink) targetingLink.classList.add('active');
                        }
                    });
                }, { root: null, rootMargin: '-25% 0px -45% 0px', threshold: 0 });

                editorialSections.forEach(section => sectionObserver.observe(section));
            }
        }
