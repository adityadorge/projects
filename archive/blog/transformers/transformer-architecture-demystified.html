        /* Custom Inverting Magic Cursor */
        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 140px;
            height: 140px;
            background-color: #FFFFFF;

            mix-blend-mode: difference; 
            transition: transform 0.1s cubic-bezier(0.215, 0.610, 0.355, 1);

        @media (max-width: 1024px) {

        // -----------------------------------------------------------------
        // 2. DYNAMIC RENDER ENGINE
        // -----------------------------------------------------------------
        document.addEventListener('DOMContentLoaded', () => {
            // Bind Header & Meta
            document.getElementById('doc-page-title').innerText = pageData.metadata.title;
            document.getElementById('bind-posted-date').innerText = `POSTED ON: ${pageData.metadata.date} // ARCHIVE MATRIX`;
            
            // Bind Hero
            document.getElementById('bind-hero-bg').style.backgroundImage = `url('${pageData.hero.bgImage}')`;
            document.getElementById('bind-pdf-link').href = pageData.hero.pdfUrl;
            document.getElementById('bind-hero-title').innerHTML = pageData.hero.title;
            document.getElementById('bind-hero-summary').innerText = pageData.hero.summary;

            // Bind Challenge
            document.getElementById('bind-challenge-title').innerText = pageData.challenge.title;
            document.getElementById('bind-challenge-body').innerText = pageData.challenge.body;

            const sidebarNav = document.getElementById('bind-sidebar-nav');

                const navLink = document.createElement('a');

                sidebarNav.appendChild(navLink);

                const article = document.createElement('article');

                article.className = `editorial-section p-8 lg:p-20 scroll-mt-0 ${sec.isStriped ? 'brutalist-strip' : ''}`;
                
                const quoteHTML = sec.quote ? `<p class="text-2xl font-normal tracking-tight border-l-4 brutalist-border pl-6 py-2 my-8 brutalist-text brutalist-bg pr-4">${sec.quote}</p>` : '';
                const paragraphsHTML = sec.paragraphs.map(p => `<p>${p}</p>`).join('');
                
                let gridHTML = '';
                if (sec.gridItems && sec.gridItems.length > 0) {
                    gridHTML = `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 my-12 border-t border-b brutalist-border py-8">

                                <div class="space-y-2">
                                    <div class="text-xs font-black tracking-wider uppercase brutalist-text">${g.title}</div>
                                    <p class="text-sm brutalist-text-muted leading-relaxed">${g.text}</p>
                                </div>
                            `).join('')}
                        </div>`;
                }

                article.innerHTML = `
                    <div class="max-w-3xl space-y-8">
                        <span class="text-[11px] font-bold tracking-widest uppercase text-indigo-600 block">${sec.logCode}</span>
                        <h2 class="text-4xl lg:text-6xl font-normal tracking-tight leading-[1.02] brutalist-text">${sec.title}</h2>
                        <div class="w-16 h-[1px] my-8" style="background-color: var(--border-main);"></div>
                        <div class="text-base lg:text-lg brutalist-text-body space-y-6 leading-relaxed font-normal">
                            ${quoteHTML}
                            ${paragraphsHTML}
                            ${gridHTML}
                            ${sec.footerParagraph ? `<p>${sec.footerParagraph}</p>` : ''}
                        </div>
                    </div>
                `;
                articlesContainer.appendChild(article);
            });

            // Bind References Section
            const refContainer = document.getElementById('bind-references-list');
            refContainer.innerHTML = pageData.references.map(r => `

        // -----------------------------------------------------------------
        // 3. UI CONTROLLERS (Theme Switcher, Cursor, Intersection Observer)
        // -----------------------------------------------------------------
        const root = document.documentElement;
        const themeToggleBtn = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('theme-sun');
        const moonIcon = document.getElementById('theme-moon');
        const themeText = document.getElementById('theme-text');

        function setTheme(theme) {
            if (theme === 'dark') {
                root.classList.remove('theme-light');
                root.classList.add('theme-dark');
                if (themeText) themeText.textContent = 'DARK';
                if (sunIcon && moonIcon) {
                    sunIcon.classList.remove('hidden');
                    sunIcon.classList.add('block');
                    moonIcon.classList.remove('block');
                    moonIcon.classList.add('hidden');
                }
                localStorage.setItem('research-theme', 'dark');
            } else {
                root.classList.remove('theme-dark');
                root.classList.add('theme-light');
                if (themeText) themeText.textContent = 'LIGHT';
                if (sunIcon && moonIcon) {
                    sunIcon.classList.remove('block');
                    sunIcon.classList.add('hidden');
                    moonIcon.classList.remove('hidden');
                    moonIcon.classList.add('block');
                }
                localStorage.setItem('research-theme', 'light');
            }
        }

        const cachedTheme = localStorage.getItem('research-theme');
        setTheme(cachedTheme || 'light');

        if (themeToggleBtn) {
            themeToggleBtn.addEventListener('click', () => {
                const isDarkActive = root.classList.contains('theme-dark');
                setTheme(isDarkActive ? 'light' : 'dark');
            });
        }

        // Custom Mouse Tracker Pipeline
        if (window.innerWidth > 1024) {
            let mouseX = 0, mouseY = 0, currentX = 0, currentY = 0;
            window.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            }, { passive: true });

            function renderCursor() {
                currentX += (mouseX - currentX) * 0.18;
                currentY += (mouseY - currentY) * 0.18;
                root.style.setProperty('--cursor-x', `${currentX}px`);
                root.style.setProperty('--cursor-y', `${currentY}px`);
                requestAnimationFrame(renderCursor);
            }
            requestAnimationFrame(renderCursor);
        }

        // Sidebar Intersection Observer function
        function initScrollObserver() {
            const editorialSections = document.querySelectorAll('.editorial-section');
            const sidebarLinks = document.querySelectorAll('.editorial-nav-item');

            if (editorialSections.length > 0 && sidebarLinks.length > 0) {
                const sectionObserver = new IntersectionObserver((entries) => {
                    entries.forEach(entry => {
                        if (entry.isIntersecting) {
                            const activeID = entry.target.getAttribute('id');
                            sidebarLinks.forEach(link => link.classList.remove('active'));
                            const targetingLink = document.querySelector(`.editorial-nav-item[href="#${activeID}"]`);
                            if (targetingLink) targetingLink.classList.add('active');
                        }
                    });
                }, { root: null, rootMargin: '-25% 0px -45% 0px', threshold: 0 });

                editorialSections.forEach(section => sectionObserver.observe(section));
            }
        }
    </script>
</body>
</html>
